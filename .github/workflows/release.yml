# 推送 v* tag 时发布（见 docs/release.md「标准步骤」，D72 / D73）：
# 检查 tag 与十一个包的版本一致、tag 指向 main 上的提交 → 完整检查 → smoke
# → 用 npm Trusted Publishing（OIDC，无 token、无 OTP）发布十一个包并 verify
# → 用上一个 tag 以来的 feat / fix / perf 提交生成 GitHub Release（scripts/commits.mjs notes）。
# 中途失败：修好后在这次运行上 Re-run，或 gh workflow run release.yml --ref v<版本>；已发布的包会跳过。
# 文件名 release.yml 写在 npm 的受信任发布方配置里，改名要同步改 npm 配置。
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: # 在 tag 上重跑：gh workflow run release.yml --ref v<版本>

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # 建 GitHub Release
  id-token: write # npm Trusted Publishing

jobs:
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 生成说明要上一个 tag 和中间的提交

      - name: Check tag
        id: v
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v=$(node -p "require('./packages/joplo/package.json').version")
          if [ "$TAG" != "v$v" ]; then
            echo "::error::tag $TAG 与 packages/*/package.json 的版本 $v 不一致：先 pnpm release:version ${TAG#v} 并提交，再在那个提交上打 tag"
            exit 1
          fi
          git fetch -q origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG 指向的提交不在 main 上：先把版本提交推到 main，再打 tag"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          case "$v" in *-*) echo "dist_tag=beta" >> "$GITHUB_OUTPUT" ;; *) echo "dist_tag=latest" >> "$GITHUB_OUTPUT" ;; esac

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: npm >= 11.5.1 (Trusted Publishing)
        run: npm install -g npm@latest && npm --version

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @joplo-app/server exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm release:smoke

      - name: Publish to npm
        run: pnpm release:publish --tag ${{ steps.v.outputs.dist_tag }}

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          node scripts/commits.mjs notes "$TAG" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          case "$TAG" in *-*) pre=--prerelease ;; *) pre= ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" $pre
          fi
