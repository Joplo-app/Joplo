name: Feature request / 功能需求
description: Suggest a feature or an improvement. / 提议新功能或改进。
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem before the solution. Joplo accepts issues, not pull requests (see CONTRIBUTING.md).
        先讲问题，再讲方案。Joplo 接受 issue，不接受 PR（见 CONTRIBUTING.md）。
  - type: textarea
    id: problem
    attributes:
      label: Problem / 想解决的问题
      description: What are you trying to do, and who runs into this? / 你想做什么，谁会遇到这个问题？
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution (optional) / 设想的方案（可选）
  - type: textarea
    id: workaround
    attributes:
      label: Current workaround (optional) / 现在的变通办法（可选）
